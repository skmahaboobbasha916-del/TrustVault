
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Document - TrustVault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #243b55;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #243b55;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Document</h2>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="original_filename">Document Filename</label>
            <input
                type="text"
                id="original_filename"
                name="original_filename"
                value="{{ document.get('original_filename', '') }}"
                maxlength="255"
                required
            >

            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ document.get('category') or '' }}"
                maxlength="100"
            >

            <button type="submit">Save Changes</button>
        </form>

        <a class="cancel" href="{{ url_for('dashboard.user_dashboard') }}">
            Cancel
        </a>
    </div>
</body>
</html>
